name: Franklin Tax Delinquent Leads

on:
  schedule:
    # Daily ~6:23 AM Eastern. The Auditor posts a new data drop about monthly;
    # on days with no new drop the run exits in seconds with no commit.
    - cron: "23 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reprocess even if the newest drop was already processed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: franklin-tax-delinquent
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run pipeline
        run: python run_pipeline.py ${{ inputs.force && '--force' || '' }}

      - name: Commit updated leads
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Franklin tax delinquent leads: $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
